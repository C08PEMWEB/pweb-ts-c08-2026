<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - hospital / antrian-engine</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="dist/admin.js" defer></script>
</head>
<body>
  <!-- GitHub Dark Top Header -->
  <header class="gh-header">
    <div class="gh-header-left">
      <!-- Hospital Logo & Breadcrumb -->
      <div class="gh-header-brand">
        <!-- Hospital SVG Icon (Medical Cross inside Hospital Building) -->
        <svg height="22" width="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--gh-success-fg);">
          <path d="M3 21h18"/>
          <path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/>
          <path d="M9 21v-4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4"/>
          <path d="M10 9h4"/>
          <path d="M12 7v4"/>
        </svg>

        <div class="gh-repo-breadcrumb">
          <a href="#">rs-santosa</a>
          <span>/</span>
          <a href="#" style="font-weight: 700;">antrian-engine</a>
          <span class="gh-public-badge">Public</span>
        </div>
      </div>
    </div>

    <!-- Right Header Actions (Profile Avatar Dropdown on Right Side) -->
    <div class="gh-header-right">
      <div class="gh-dropdown-wrapper">
        <button id="btn-profile-toggle" class="gh-profile-btn" type="button" title="Menu Pengguna">
          <div class="gh-avatar-icon">
            <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M10.561 8.073a6.005 6.005 0 0 1 3.432 5.142.75.75 0 1 1-1.498.07 4.5 4.5 0 0 0-8.99 0 .75.75 0 0 1-1.498-.07 6.004 6.004 0 0 1 3.431-5.142 3.999 3.999 0 1 1 5.123 0ZM10.5 5a2.5 2.5 0 1 0-5 0 2.5 2.5 0 0 0 5 0Z"></path>
            </svg>
          </div>
          <svg height="12" width="12" viewBox="0 0 16 16" fill="currentColor" style="color: var(--gh-fg-muted);">
            <path d="m4.427 7.427 3.396 3.396a.25.25 0 0 0 .354 0l3.396-3.396A.25.25 0 0 0 11.396 7H4.604a.25.25 0 0 0-.177.427Z"></path>
          </svg>
        </button>

        <!-- Dropdown Menu Aligned to Right -->
        <div id="profile-dropdown-menu" class="gh-dropdown-menu">
          <div class="gh-dropdown-header">
            <div>Signed in as</div>
            <div class="gh-dropdown-user">
              <span id="navbar-user-name">Admin</span>
              <span id="navbar-user-role" class="badge badge-primary">ADMIN</span>
            </div>
          </div>
          <div class="gh-dropdown-divider"></div>
          <a href="operator.html" class="gh-dropdown-item">
            <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M8 1.5a6.5 6.5 0 0 0-6.5 6.5v4.25c0 .414.336.75.75.75h1.5a.75.75 0 0 0 .75-.75V8.5a.75.75 0 0 0-.75-.75H2.26A5.002 5.002 0 0 1 8 3a5.002 5.002 0 0 1 5.74 4.75h-1.49a.75.75 0 0 0-.75.75v3.75c0 .414.336.75.75.75h1.5a.75.75 0 0 0 .75-.75V8A6.5 6.5 0 0 0 8 1.5Zm-4.25 8.5v2.25H2.5V10h1.25Zm9.5 0v2.25h-1.25V10h1.25Z"></path>
            </svg>
            Panel Operator
          </a>
          <a href="layar.html" class="gh-dropdown-item">
            <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M1.75 2.5h12.5a.25.25 0 0 1 .25.25v7.5a.25.25 0 0 1-.25.25H1.75a.25.25 0 0 1-.25-.25v-7.5a.25.25 0 0 1 .25-.25ZM0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v7.5A1.75 1.75 0 0 1 14.25 12H9v1.25h1.75a.75.75 0 0 1 0 1.5h-5.5a.75.75 0 0 1 0-1.5H7V12H1.75A1.75 1.75 0 0 1 0 10.25v-7.5Z"></path>
            </svg>
            Layar Monitor Publik
          </a>
          <a href="ambil-antrian.html" class="gh-dropdown-item">
            <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M0 3.75C0 2.784.784 2 1.75 2h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 14H1.75A1.75 1.75 0 0 1 0 12.25Zm1.75-.25a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25v-8.5a.25.25 0 0 0-.25-.25Z"></path>
            </svg>
            Kiosk Ambil Antrian
          </a>
          <div class="gh-dropdown-divider"></div>
          <button id="btn-reset-antrian" class="gh-dropdown-item gh-dropdown-item-danger" type="button">
            <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M1.705 8.005a.75.75 0 0 1 .834.656 5.5 5.5 0 0 0 9.592 2.97l-1.204-1.204a.25.25 0 0 1 .177-.427h3.646a.25.25 0 0 1 .25.25v3.646a.25.25 0 0 1-.427.177l-1.38-1.38A7 7 0 0 1 1.05 8.84a.75.75 0 0 1 .656-.834ZM8 2.5a5.487 5.487 0 0 0-4.131 1.869l1.204 1.204A.25.25 0 0 1 4.896 6H1.25A.25.25 0 0 1 1 5.75V2.104a.25.25 0 0 1 .427-.177l1.38 1.38A7 7 0 0 1 14.95 7.16a.75.75 0 0 1-1.49.178A5.5 5.5 0 0 0 8 2.5Z"></path>
            </svg>
            Reset Seluruh Antrian
          </button>
          <div class="gh-dropdown-divider"></div>
          <button id="btn-logout" class="gh-dropdown-item" type="button">
            <svg height="14" width="14" viewBox="0 0 16 16" fill="currentColor">
              <path d="M2 2.75C2 1.784 2.784 1 3.75 1h2.5a.75.75 0 0 1 0 1.5h-2.5a.25.25 0 0 0-.25.25v10.5c0 .138.112.25.25.25h2.5a.75.75 0 0 1 0 1.5h-2.5A1.75 1.75 0 0 1 2 13.25Zm10.44 3.97a.75.75 0 0 1 1.06 0l3 3a.75.75 0 0 1 0 1.06l-3 3a.751.751 0 0 1-1.042-.018.751.751 0 0 1-.018-1.042l1.72-1.72H6.75a.75.75 0 0 1 0-1.5h7.44l-1.72-1.72a.75.75 0 0 1 0-1.06Z"></path>
            </svg>
            Sign out
          </button>
        </div>
      </div>
    </div>
  </header>

  <!-- GitHub Dark Subnav Tabs -->
  <nav class="gh-subnav">
    <a href="#" class="gh-tab active">
      <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path>
        <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"></path>
      </svg>
      Dashboard Antrian
    </a>
    <a href="operator.html" class="gh-tab">
      <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M8 1.5a6.5 6.5 0 0 0-6.5 6.5v4.25c0 .414.336.75.75.75h1.5a.75.75 0 0 0 .75-.75V8.5a.75.75 0 0 0-.75-.75H2.26A5.002 5.002 0 0 1 8 3a5.002 5.002 0 0 1 5.74 4.75h-1.49a.75.75 0 0 0-.75.75v3.75c0 .414.336.75.75.75h1.5a.75.75 0 0 0 .75-.75V8A6.5 6.5 0 0 0 8 1.5Zm-4.25 8.5v2.25H2.5V10h1.25Zm9.5 0v2.25h-1.25V10h1.25Z"></path>
      </svg>
      Panel Operator
    </a>
    <a href="layar.html" class="gh-tab">
      <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M1.75 2.5h12.5a.25.25 0 0 1 .25.25v7.5a.25.25 0 0 1-.25.25H1.75a.25.25 0 0 1-.25-.25v-7.5a.25.25 0 0 1 .25-.25ZM0 2.75C0 1.784.784 1 1.75 1h12.5c.966 0 1.75.784 1.75 1.75v7.5A1.75 1.75 0 0 1 14.25 12H9v1.25h1.75a.75.75 0 0 1 0 1.5h-5.5a.75.75 0 0 1 0-1.5H7V12H1.75A1.75 1.75 0 0 1 0 10.25v-7.5Z"></path>
      </svg>
      Layar Monitor
    </a>
    <a href="ambil-antrian.html" class="gh-tab">
      <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor">
        <path d="M0 3.75C0 2.784.784 2 1.75 2h12.5c.966 0 1.75.784 1.75 1.75v8.5A1.75 1.75 0 0 1 14.25 14H1.75A1.75 1.75 0 0 1 0 12.25Zm1.75-.25a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h12.5a.25.25 0 0 0 .25-.25v-8.5a.25.25 0 0 0-.25-.25Z"></path>
      </svg>
      Kiosk Mandiri
    </a>
  </nav>

  <div class="container">
    <!-- Flash Messages / Alert Container -->
    <div id="alert-container"></div>

    <!-- GitHub 2-Column Layout -->
    <div class="grid-admin">
      <!-- Kolom Kiri: Labels / Master Data Jenis Antrian -->
      <section>
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">
              <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" style="color: var(--gh-fg-muted);">
                <path d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.752 1.752 0 0 1 1 7.775Zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25ZM6 5a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path>
              </svg>
              Master Jenis Antrian
            </h2>
          </div>

          <div class="card-body" style="padding-bottom: 0;">
            <!-- Form Tambah Jenis Antrian Baru -->
            <form id="form-add-service">
              <div class="form-row">
                <div style="flex: 0 0 70px;">
                  <label for="input-service-code" class="form-label">Kode</label>
                  <input 
                    type="text" 
                    id="input-service-code" 
                    class="form-input" 
                    maxlength="1" 
                    placeholder="C" 
                    required 
                    style="text-transform: uppercase; text-align: center; font-weight: bold; font-family: var(--font-family-mono);"
                  >
                </div>
                <div style="flex: 1;">
                  <label for="input-service-name" class="form-label">Nama Layanan</label>
                  <input 
                    type="text" 
                    id="input-service-name" 
                    class="form-input" 
                    placeholder="Contoh: Farmasi" 
                    required
                  >
                </div>
                <button type="submit" class="btn btn-primary" style="white-space: nowrap;">
                  Tambah
                </button>
              </div>
              <p class="text-xs text-muted" style="margin-top: 6px; margin-bottom: 14px;">
                *1 huruf kapital unik (A-Z) & nama unik.
              </p>
            </form>
          </div>

          <!-- Daftar Layanan (GitHub Labels Row style) -->
          <div id="service-list-container" style="border-top: 1px solid var(--gh-border-default);">
            <!-- Rendered by admin.ts -->
          </div>
        </div>
      </section>

      <!-- Kolom Kanan: Issues / Queue Status & Ticket Creation -->
      <section>
        <!-- Form Penerbitan Tiket Manual -->
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">
            <h2 class="card-title">
              <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" style="color: var(--gh-success-fg);">
                <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm7.25-3.25a.75.75 0 0 0-1.5 0V7.25H4a.75.75 0 0 0 0 1.5h3.25v3.25a.75.75 0 0 0 1.5 0V8.75H12a.75.75 0 0 0 0-1.5H8.75Z"></path>
              </svg>
              Terbitkan Tiket Manual
            </h2>
          </div>
          <div class="card-body">
            <form id="form-create-ticket">
              <div class="form-row" style="flex-wrap: wrap;">
                <div style="flex: 1; min-width: 180px;">
                  <label for="select-ticket-service" class="form-label">Jenis Antrian</label>
                  <select id="select-ticket-service" class="form-select" required>
                    <option value="" disabled selected>Pilih jenis antrian</option>
                  </select>
                </div>
                <div style="flex: 1; min-width: 140px;">
                  <label for="select-ticket-priority" class="form-label">Tingkat Prioritas</label>
                  <select id="select-ticket-priority" class="form-select" required>
                    <option value="Normal" selected>Normal</option>
                    <option value="Lansia">Lansia</option>
                    <option value="Disabilitas">Disabilitas</option>
                    <option value="VIP">VIP</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary" style="white-space: nowrap;">
                  Terbitkan Tiket
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Main Status Overview Box (GitHub Issues Layout) -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" style="color: var(--gh-success-fg);">
                <path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path>
                <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"></path>
              </svg>
              <span>Antrian Aktif Rumah Sakit</span>
            </div>
            <span class="gh-counter" id="total-tickets-info">0 Tiket</span>
          </div>

          <div class="card-body" style="padding: 16px;">
            <div id="queue-overview-container">
              <!-- Rendered dynamically by admin.ts -->
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
