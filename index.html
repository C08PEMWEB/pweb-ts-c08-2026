<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard Admin - hospital / antrian-engine</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="dist/admin.js" defer></script>
</head>
<body>
  <!-- Navigasi utama: dirender oleh setupNavbar() di src/utils/guard.ts sesuai role -->
  <header id="app-header" class="gh-header"></header>
  <nav id="app-subnav" class="gh-subnav" aria-label="Navigasi utama"></nav>

  <div class="container">
    <div class="page-header">
      <div>
        <h1 class="page-title">Dashboard Admin</h1>
        <p class="page-subtitle">Kelola jenis layanan, terbitkan tiket manual, dan pantau seluruh antrian.</p>
      </div>
    </div>

    <!-- Flash Messages / Alert Container -->
    <div id="alert-container"></div>

    <!-- GitHub 2-Column Layout -->
    <div class="grid-admin">
      <!-- Kolom Kiri: Labels / Master Data Jenis Antrian -->
      <section>
        <div class="card">
          <div class="card-header">
            <h2 class="card-title">
              <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" style="color: var(--gh-fg-muted);">
                <path d="M1 7.775V2.75C1 1.784 1.784 1 2.75 1h5.025c.464 0 .91.184 1.238.513l6.25 6.25a1.75 1.75 0 0 1 0 2.474l-5.026 5.026a1.75 1.75 0 0 1-2.474 0l-6.25-6.25A1.752 1.752 0 0 1 1 7.775Zm1.5 0c0 .066.026.13.073.177l6.25 6.25a.25.25 0 0 0 .354 0l5.025-5.025a.25.25 0 0 0 0-.354l-6.25-6.25a.25.25 0 0 0-.177-.073H2.75a.25.25 0 0 0-.25.25ZM6 5a1 1 0 1 1 0-2 1 1 0 0 1 0 2Z"></path>
              </svg>
              Master Jenis Antrian
            </h2>
          </div>

          <div class="card-body" style="padding-bottom: 0;">
            <!-- Form Tambah Jenis Antrian Baru -->
            <form id="form-add-service">
              <div class="form-row">
                <div style="flex: 0 0 70px;">
                  <label for="input-service-code" class="form-label">Kode</label>
                  <input 
                    type="text" 
                    id="input-service-code" 
                    class="form-input" 
                    maxlength="1" 
                    placeholder="C" 
                    required 
                    style="text-transform: uppercase; text-align: center; font-weight: bold; font-family: var(--font-family-mono);"
                  >
                </div>
                <div style="flex: 1;">
                  <label for="input-service-name" class="form-label">Nama Layanan</label>
                  <input 
                    type="text" 
                    id="input-service-name" 
                    class="form-input" 
                    placeholder="Contoh: Farmasi" 
                    required
                  >
                </div>
                <button type="submit" class="btn btn-primary" style="white-space: nowrap;">
                  Tambah
                </button>
              </div>
              <p class="text-xs text-muted" style="margin-top: 6px; margin-bottom: 14px;">
                *1 huruf kapital unik (A-Z) & nama unik.
              </p>
            </form>
          </div>

          <!-- Daftar Layanan (GitHub Labels Row style) -->
          <div id="service-list-container" style="border-top: 1px solid var(--gh-border-default);">
            <!-- Rendered by admin.ts -->
          </div>
        </div>
      </section>

      <!-- Kolom Kanan: Issues / Queue Status & Ticket Creation -->
      <section>
        <!-- Form Penerbitan Tiket Manual -->
        <div class="card" style="margin-bottom: 16px;">
          <div class="card-header">
            <h2 class="card-title">
              <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" style="color: var(--gh-success-fg);">
                <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Zm7.25-3.25a.75.75 0 0 0-1.5 0V7.25H4a.75.75 0 0 0 0 1.5h3.25v3.25a.75.75 0 0 0 1.5 0V8.75H12a.75.75 0 0 0 0-1.5H8.75Z"></path>
              </svg>
              Terbitkan Tiket Manual
            </h2>
          </div>
          <div class="card-body">
            <form id="form-create-ticket">
              <div class="form-row" style="flex-wrap: wrap;">
                <div style="flex: 1; min-width: 180px;">
                  <label for="select-ticket-service" class="form-label">Jenis Antrian</label>
                  <select id="select-ticket-service" class="form-select" required>
                    <option value="" disabled selected>Pilih jenis antrian</option>
                  </select>
                </div>
                <div style="flex: 1; min-width: 140px;">
                  <label for="select-ticket-priority" class="form-label">Tingkat Prioritas</label>
                  <select id="select-ticket-priority" class="form-select" required>
                    <option value="Normal" selected>Normal</option>
                    <option value="Lansia">Lansia</option>
                    <option value="Disabilitas">Disabilitas</option>
                    <option value="VIP">VIP</option>
                  </select>
                </div>
                <button type="submit" class="btn btn-primary" style="white-space: nowrap;">
                  Terbitkan Tiket
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Main Status Overview Box (GitHub Issues Layout) -->
        <div class="card">
          <div class="card-header">
            <div class="card-title">
              <svg height="16" width="16" viewBox="0 0 16 16" fill="currentColor" style="color: var(--gh-success-fg);">
                <path d="M8 9.5a1.5 1.5 0 1 0 0-3 1.5 1.5 0 0 0 0 3Z"></path>
                <path d="M8 0a8 8 0 1 1 0 16A8 8 0 0 1 8 0ZM1.5 8a6.5 6.5 0 1 0 13 0 6.5 6.5 0 0 0-13 0Z"></path>
              </svg>
              <span>Antrian Aktif Rumah Sakit</span>
            </div>
            <span class="gh-counter" id="total-tickets-info">0 Tiket</span>
          </div>

          <div class="card-body" style="padding: 16px;">
            <div id="queue-overview-container">
              <!-- Rendered dynamically by admin.ts -->
            </div>
          </div>
        </div>
      </section>
    </div>
  </div>
</body>
</html>
