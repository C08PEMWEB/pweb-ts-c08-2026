<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kiosk Ambil Antrian</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="dist/ambil-antrian.js" defer></script>
</head>
<body>
  <!-- Navigasi utama: dirender oleh setupNavbar() di src/utils/guard.ts sesuai role -->
  <header id="app-header" class="gh-header"></header>
  <nav id="app-subnav" class="gh-subnav" aria-label="Navigasi utama"></nav>

  <main class="container container-narrow">
    <div class="page-header">
      <div>
        <h1 class="page-title">Kiosk Mandiri – Ambil Nomor Antrian</h1>
        <p class="page-subtitle">Pilih layanan dan tingkat prioritas, lalu ambil nomor antrian Anda.</p>
      </div>
    </div>

    <div class="card">
      <div class="card-body">
        <form id="form-kiosk">
          <div class="form-group">
            <label for="select-service" class="form-label">Pilih Layanan</label>
            <select id="select-service" class="form-select" required>
              <option value="" disabled selected>-- Pilih Layanan --</option>
            </select>
          </div>

          <div class="form-group">
            <label for="select-priority" class="form-label">Pilih Prioritas</label>
            <select id="select-priority" class="form-select">
              <option value="Normal">Normal</option>
              <option value="Lansia">Lansia</option>
              <option value="Disabilitas">Disabilitas</option>
              <option value="VIP">VIP</option>
            </select>
          </div>

          <button type="submit" id="btn-submit-kiosk" class="btn btn-primary btn-block">Ambil Nomor Antrian</button>
        </form>
      </div>
    </div>

    <div id="kiosk-result" class="kiosk-ticket" hidden>
      <h2 class="kiosk-ticket-title">Tiket Antrian Anda</h2>
      <p class="kiosk-ticket-meta">Layanan: <strong id="result-service">-</strong></p>
      <p class="kiosk-ticket-number" id="result-number">-</p>
      <p class="kiosk-ticket-meta">Prioritas: <strong id="result-priority">-</strong></p>
      <p class="kiosk-ticket-hint">Pantau nomor Anda di <a href="layar.html">Layar Antrian</a>.</p>
    </div>
  </main>
</body>
</html>
