<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Sistem Antrian Rumah Sakit</title>
  <link rel="stylesheet" href="css/style.css">
  <script type="module" src="dist/login.js" defer></script>
</head>
<body class="auth-page">
  <main class="auth-wrapper">
    <div class="auth-brand">
      <svg height="40" width="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="color: var(--gh-success-fg);">
        <path d="M3 21h18"/><path d="M5 21V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16"/><path d="M9 21v-4a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v4"/><path d="M10 9h4"/><path d="M12 7v4"/>
      </svg>
      <h1 class="auth-title">Masuk ke Sistem Antrian</h1>
      <p class="auth-subtitle">rs-santosa / antrian-engine</p>
    </div>

    <div class="card auth-card">
      <div class="card-body">
        <div id="login-alert"></div>

        <form id="form-login">
          <div class="form-group">
            <label for="input-username" class="form-label">Username</label>
            <input type="text" id="input-username" class="form-input" placeholder="misal: emilys" autocomplete="username" required>
          </div>

          <div class="form-group">
            <label for="input-password" class="form-label">Password</label>
            <input type="password" id="input-password" class="form-input" placeholder="password" autocomplete="current-password" required>
          </div>

          <button type="submit" id="btn-submit-login" class="btn btn-primary btn-block">Masuk</button>
        </form>
      </div>
    </div>

    <div class="auth-note">
      <strong>Akun uji coba (DummyJSON)</strong>
      <div>Admin: <code>emilys</code> / <code>emilyspass</code></div>
      <div>Moderator: <code>oliviaw</code> / <code>oliviawpass</code></div>
      <div>User biasa: <code>averyp</code> / <code>averyppass</code></div>
    </div>

    <p class="auth-footer">
      Pengunjung? <a href="layar.html">Lihat Layar Antrian</a>
    </p>
  </main>
</body>
</html>
